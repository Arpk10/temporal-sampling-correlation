[project]
name = "temporal-sampling-correlation"
version = "0.3.1"
description = "Prime Intellect verifiers v1 environment for controlled temporal correlation in stochastic GPT-2 sampling."
requires-python = ">=3.11,<3.15"
dependencies = [
  "verifiers>=0.3.2",
  "numpy>=2.1",
  "pandas>=2.2",
  "torch>=2.5",
  "transformers>=4.45",
]

[build-system]
requires = "hatchling"
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["temporal_sampling_correlation"]

[project.scripts]
tsc-run = "temporal_sampling_correlation.runner:main"
